server {
    listen 80;
    listen [::]:80;
    server_name silverse.fr www.silverse.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://silverse.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.silverse.fr;

    ssl_certificate /etc/letsencrypt/live/silverse.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silverse.fr/privkey.pem;

    return 301 https://silverse.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name silverse.fr;

    ssl_certificate /etc/letsencrypt/live/silverse.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silverse.fr/privkey.pem;

    access_log /var/log/nginx/silverse-shop.access.log;
    error_log /var/log/nginx/silverse-shop.error.log;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /api/webhooks/moneyfusion {
        access_log off;
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
